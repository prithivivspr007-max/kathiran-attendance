name: Build Kathiran Attendance APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          mkdir -p buildsrc
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)
          if [ -z "$ZIP" ]; then
            echo "No project ZIP found"
            exit 1
          fi
          unzip -q "$ZIP" -d buildsrc

          INNER=$(find buildsrc -type f -name "*.zip" | head -1)
          if [ -n "$INNER" ]; then
            mkdir -p buildsrc/final
            unzip -q "$INNER" -d buildsrc/final
            ROOT=$(find buildsrc/final -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
          else
            ROOT=$(find buildsrc -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kathiran-attendance-apk
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
